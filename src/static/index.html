<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f2ed" />
    <meta
      name="description"
      content="Music discovery shaped by the songs you save and the music you play."
    />
    <title>SoundVector</title>
    <link rel="icon" href="/mark.svg" />
    <link rel="stylesheet" href="/style.css?v=5.0" />
    <script src="/core.js?v=5.0" defer></script>
    <script src="/script.js?v=5.0" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#mainContent">Skip to music</a>
    <header class="topbar">
      <a href="#/home" class="brand" aria-label="SoundVector home"
        ><svg
          class="brand-mark"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 32 32"
          fill="none"
        >
          <path
            d="M27 15A12 12 0 1 0 18 28M22 14a7 7 0 1 0-5 9"
            stroke="#6840bd"
            stroke-width="2.8"
            stroke-linecap="round"
          />
          <circle cx="15" cy="16" r="2.4" fill="#6840bd" />
          <path
            d="m17 14 10-9m-5 0h5v5"
            stroke="#6840bd"
            stroke-width="2.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          /></svg
        ><span>SoundVector</span></a
      >
      <nav class="nav-list" aria-label="Main navigation">
        <a href="#/home" data-view="home">Home</a>
        <a href="#/discover" data-view="discover">Discover</a>
        <a href="#/library" data-view="library"
          >Library<span id="libraryCount" class="nav-count"></span
        ></a>
      </nav>
      <form id="searchForm" class="search-wrap" role="search">
        <label class="sr-only" for="searchInput"
          >Search songs, artists, or albums</label
        >
        <span class="search-symbol" data-icon="search"></span>
        <input
          id="searchInput"
          type="text"
          inputmode="search"
          enterkeyhint="search"
          placeholder="Songs, artists, albums"
          autocomplete="off"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="searchSuggestions"
        />
        <button
          type="button"
          class="search-clear icon-button"
          data-action="clear-search"
          aria-label="Clear search"
          hidden
        >
          <span data-icon="close"></span>
        </button>
        <kbd aria-hidden="true">⌘ K</kbd>
        <div
          id="searchSuggestions"
          class="search-suggestions"
          role="listbox"
          aria-label="Search suggestions"
          hidden
        ></div>
      </form>
      <button
        class="profile-button"
        id="profileButton"
        data-action="profile"
        aria-label="Switch listening profile"
      >
        <span class="profile-avatar" id="profileInitial">Y</span
        ><span id="profileName">Your space</span
        ><span data-icon="chevronDown"></span>
      </button>
    </header>
    <main id="mainContent" tabindex="-1"></main>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <a href="#/home" data-view="home"
        ><span data-icon="home"></span><span>Home</span></a
      >
      <a href="#/discover" data-view="discover"
        ><span data-icon="compass"></span><span>Discover</span></a
      >
      <a href="#/library" data-view="library"
        ><span data-icon="library"></span><span>Library</span></a
      >
    </nav>
    <section
      id="player"
      class="player"
      aria-label="Music preview player"
      hidden
    >
      <div class="player-track">
        <div id="playerArt" class="player-art"></div>
        <button
          class="player-title"
          data-action="player-menu"
          aria-label="Open current song menu"
        >
          <strong id="playerTitle"></strong><span id="playerArtist"></span>
        </button>
        <button
          id="playerSave"
          class="icon-button"
          data-action="player-save"
          aria-label="Save current song"
          aria-pressed="false"
        >
          <span data-icon="thumbsUp"></span></button
        ><button
          id="playerDislike"
          class="icon-button"
          data-action="player-dislike"
          aria-label="Dislike current song"
          aria-pressed="false"
        >
          <span data-icon="thumbsDown"></span>
        </button>
      </div>
      <div class="player-center">
        <div class="player-buttons">
          <button
            class="icon-button"
            data-action="previous"
            aria-label="Previous song"
          >
            <span data-icon="previous"></span></button
          ><button
            id="playerToggle"
            class="play-main"
            data-action="toggle-play"
            aria-label="Play preview"
          >
            <span data-icon="play"></span></button
          ><button
            class="icon-button"
            data-action="next"
            aria-label="Next song"
          >
            <span data-icon="next"></span></button
          ><span id="previewLabel" class="preview-label">Preview</span>
        </div>
        <div class="player-timeline">
          <time id="elapsed">0:00</time
          ><input
            id="seek"
            aria-label="Preview position"
            type="range"
            min="0"
            max="30"
            step=".1"
            value="0"
          /><time id="duration">0:30</time>
        </div>
      </div>
      <div class="player-end">
        <button
          class="icon-button"
          data-action="player-insights"
          aria-label="Song insights"
        >
          <span data-icon="spark"></span>
        </button>
        <button
          class="icon-button"
          data-action="player-menu"
          aria-label="More options for current song"
        >
          <span data-icon="more"></span>
        </button>
        <span data-icon="volume"></span
        ><input
          id="volume"
          type="range"
          min="0"
          max="1"
          step=".05"
          value=".7"
          aria-label="Volume"
        /><button
          class="icon-button"
          data-action="queue"
          aria-label="Open play queue"
        >
          <span data-icon="queue"></span>
        </button>
      </div>
    </section>
    <div
      id="trackPopover"
      class="track-popover"
      popover
      aria-label="Song options"
    ></div>
    <dialog id="appDialog" class="app-dialog" aria-labelledby="dialogTitle">
      <div class="dialog-top">
        <h2 id="dialogTitle"></h2>
        <button
          class="icon-button"
          data-action="close-dialog"
          aria-label="Close dialog"
        >
          <span data-icon="close"></span>
        </button>
      </div>
      <div id="dialogBody"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div
      id="announcer"
      class="sr-only"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <noscript
      ><p class="empty-state">
        SoundVector needs JavaScript for search and preview playback.
      </p></noscript
    >
  </body>
</html>
