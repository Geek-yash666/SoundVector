name: Sync src/ to soundvector-ui

on:
  push:
    branches: [main]
    paths:
      - "src/**"
  workflow_dispatch:

concurrency:
  group: sync-ui
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SoundVector
        uses: actions/checkout@v4

      - name: Checkout soundvector-ui
        uses: actions/checkout@v4
        with:
          repository: Yash-render/soundvector-ui
          ref: main
          path: ui
          token: ${{ secrets.UI_REPO_TOKEN }}

      - name: Mirror src/ into soundvector-ui
        run: rsync -a --delete --exclude='.git' src/ ui/

      - name: Commit and push if changed
        working-directory: ui
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to sync."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: ${GITHUB_SHA::7} from Geek-yash666/SoundVector"
          git push origin HEAD:main
